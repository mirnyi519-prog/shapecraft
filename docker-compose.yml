services:
  shapecraft:
    build:
      context: .
      args:
        BASE_IMAGE: ${BASE_IMAGE:-mirror.gcr.io/library/node:22-bookworm-slim}
    # Host network: на этом VPS из bridge нет доступа к api.telegram.org
    # и часто нет доступа к портам хоста (relay). Caddy ходит на gateway:3000.
    network_mode: host
    environment:
      DATABASE_URL: file:/app/data/prod.db
      AUTH_SECRET: ${AUTH_SECRET:-change-me-to-a-long-random-string}
      BLOCKED_IPS: ${BLOCKED_IPS:-34.16.206.147}
      OWNER_LOGIN: ${OWNER_LOGIN:-admin}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-shapecraft123}
      PARTNER_LOGIN: ${PARTNER_LOGIN:-partner}
      PARTNER_PASSWORD: ${PARTNER_PASSWORD:-shapecraft123}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      UPLOADS_DIR: /app/public/uploads
      WORLD_IMPORT_SECRET: ${WORLD_IMPORT_SECRET:-}
      WORLD_SYNC_URL: ${WORLD_SYNC_URL:-https://raw.githubusercontent.com/mirnyi519-prog/shapecraft/master/data/world-import.json}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # Прямая отправка: приложение уже в host network
      TELEGRAM_RELAY_URL: ""
      NODE_ENV: production
      TZ: Europe/Moscow
    env_file:
      - .env
    volumes:
      - shapecraft_data:/app/data
      - shapecraft_uploads:/app/public/uploads
    restart: unless-stopped

volumes:
  shapecraft_data:
  shapecraft_uploads:
