services:
  shapecraft:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: file:/app/data/prod.db
      AUTH_SECRET: ${AUTH_SECRET:-change-me-to-a-long-random-string}
      OWNER_LOGIN: ${OWNER_LOGIN:-admin}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-shapecraft123}
      PARTNER_LOGIN: ${PARTNER_LOGIN:-partner}
      PARTNER_PASSWORD: ${PARTNER_PASSWORD:-shapecraft123}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      NODE_ENV: production
    volumes:
      - shapecraft_data:/app/data
      - shapecraft_uploads:/app/public/uploads
    restart: unless-stopped

volumes:
  shapecraft_data:
  shapecraft_uploads:
